[project]
name = "jb-studio-backend"
version = "0.1.0"
description = "Jailbreak Pipeline Studio — FastAPI backend wrapping mini_harness.py and classify_prompt.py"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
